<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anixart Avatar Fetcher</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        input { padding: 5px; font-size: 16px; }
        button { padding: 5px 10px; font-size: 16px; }
        #avatar { max-width: 200px; margin-top: 20px; }
        #error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Enter Anixart Profile URL</h2>
    <input type="text" id="profileUrl" placeholder="https://anixart-app.com/profile/14887">
    <br><br>
    <button onclick="fetchAvatar()">Get Avatar</button>
    <div id="avatar"></div>
    <div id="error"></div>

    <script>
        async function fetchAvatar() {
            const urlInput = document.getElementById('profileUrl').value;
            const errorDiv = document.getElementById('error');
            const avatarDiv = document.getElementById('avatar');

            errorDiv.textContent = '';
            avatarDiv.innerHTML = '';

            const match = urlInput.match(/\/profile\/(\d+)/);
            if (!match) {
                errorDiv.textContent = 'Invalid URL format.';
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/fetch-avatar', {  // Ваш backend URL
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profile_url: urlInput })
                });

                const result = await response.json();
                if (result.avatar_url) {
                    avatarDiv.innerHTML = `<img src="${result.avatar_url}" alt="Avatar">`;
                } else {
                    errorDiv.textContent = result.error || 'Avatar not found.';
                }
            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
