<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anixart Achievement Fetcher</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        input { padding: 5px; font-size: 16px; width: 300px; }
        button { padding: 5px 10px; font-size: 16px; }
        #achievement { max-width: 200px; margin-top: 20px; }
        #error { color: red; margin-top: 10px; background: #fee; padding: 10px; border-radius: 5px; }
        #cookieNote { color: gray; font-size: 12px; }
    </style>
</head>
<body>
    <h2>Anixart Achievement Fetcher</h2>
    <p>Введите ссылку на профиль для получения достижения</p>
    <input type="text" id="profileUrl" placeholder="https://anixart-app.com/profile/45435">
    <br><br>
    <input type="text" id="cookieInput" placeholder="Paste cookies here (e.g., __ddg1_=...; __ddg8_=...)">
    <br><br>
    <button onclick="fetchAchievement()">Получить достижение</button>
    <div id="achievement"></div>
    <div id="error"></div>
    <div id="cookieNote">Скопируйте куки из браузера (F12 → Network → Cookies) после посещения Anixart. Куки истекают ~20 мин.</div>

    <script>
        async function fetchAchievement() {
            const urlInput = document.getElementById('profileUrl').value.trim();
            const cookieInput = document.getElementById('cookieInput').value;
            const errorDiv = document.getElementById('error');
            const achievementDiv = document.getElementById('achievement');

            errorDiv.innerHTML = '';
            achievementDiv.innerHTML = '';

            if (!urlInput) {
                errorDiv.innerHTML = '<strong>Это поле обязательно для заполнения</strong>';
                return;
            }

            const headers = {
                'Content-Type': 'application/json',
            };
            if (cookieInput) {
                headers['Cookie'] = cookieInput;
            }

            const requestBody = { profileInput: urlInput }; // Как в форме Anixart

            // Основной эндпоинт (предполагаемый для запроса)
            let achievementUrl = 'https://anixart-app.com/api/achievement/request';
            try {
                const response = await fetch(achievementUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    // Fallback на ваш пример (если request не работает)
                    achievementUrl = 'https://anixart-app.com/api/achievement/get';
                    const fallbackResponse = await fetch(achievementUrl, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ ...requestBody, code: 'C8V4M-J1X0Z-A3Q9W' }) // Пример кода
                    });
                    if (!fallbackResponse.ok) throw new Error(`HTTP ${fallbackResponse.status}: ${fallbackResponse.statusText}`);
                    var achievementData = await fallbackResponse.json();
                } else {
                    var achievementData = await response.json();
                }

                // Отображение иконки (предполагаемые поля из ответа)
                const achievementIcon = achievementData.icon || achievementData.badge_url || achievementData.image;
                if (achievementIcon) {
                    achievementDiv.innerHTML = `<img src="${achievementIcon}" alt="Достижение" style="max-width: 200px;"> <p>Код достижения: ${achievementData.code || 'N/A'}</p>`;
                } else if (achievementData.error === 'limit_reached') {
                    errorDiv.innerHTML = '<strong>Достигнут лимит получения достижений. Попробуй позже.</strong>';
                } else {
                    errorDiv.innerHTML = '<strong>Достижение получено, но иконка не найдена.</strong>';
                }
            } catch (error) {
                errorDiv.innerHTML = `<strong>Ошибка: ${error.message}. Проверьте куки или ссылку.</strong>`;
            }
        }
    </script>
</body>
</html>
